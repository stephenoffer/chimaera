# Generated by `chimaera k8s render`. Create the token Secret once, then apply:
#   kubectl create secret generic chimaera-token --from-literal=token="$(chimaera cluster token)"
#   chimaera k8s render ... | kubectl apply -f -
apiVersion: v1
kind: Service
metadata:
  name: chimaera-peers
  labels:
    app.kubernetes.io/name: chimaera
    app.kubernetes.io/instance: chimaera
spec:
  # Peers find each other by pod DNS name; founders must resolve before they are ready.
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: chimaera
    app.kubernetes.io/instance: chimaera
  ports:
    - name: peer
      port: 7700
---
apiVersion: v1
kind: Service
metadata:
  name: chimaera
  labels:
    app.kubernetes.io/name: chimaera
    app.kubernetes.io/instance: chimaera
spec:
  # Drivers outside the pods connect here with the cluster token.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: chimaera
    app.kubernetes.io/instance: chimaera
  ports:
    - name: client
      port: 7710
      targetPort: client
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chimaera
  labels:
    app.kubernetes.io/name: chimaera
    app.kubernetes.io/instance: chimaera
spec:
  serviceName: chimaera-peers
  replicas: 3
  # OrderedReady would deadlock formation: pod 0 is not ready until the other founders exist.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: chimaera
      app.kubernetes.io/instance: chimaera
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chimaera
        app.kubernetes.io/instance: chimaera
      # Each peer serves its status as Prometheus metrics (CHIMAERA_METRICS_LISTEN).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9700"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      # SIGTERM drains for CHIMAERA_DRAIN_SECONDS (default 30) before the peer exits.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: peer
          image: "chimaera:dev"
          imagePullPolicy: IfNotPresent
          command: ["chimaera", "--dir", "/data", "peer", "start", "--provider", "k8s"]
          env:
            - name: CHIMAERA_K8S_SERVICE
              value: "chimaera-peers"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CHIMAERA_FOUNDERS
              value: "3"
            - name: CHIMAERA_PORT
              value: "7700"
            - name: CHIMAERA_CLIENT_PORT
              value: "7710"
            - name: CHIMAERA_POOL
              value: "chimaera"
            - name: CHIMAERA_METRICS_LISTEN
              value: "0.0.0.0:9700"
            - name: CHIMAERA_CLUSTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chimaera-token
                  key: token
          ports:
            - name: peer
              containerPort: 7700
            - name: client
              containerPort: 7710
            - name: metrics
              containerPort: 9700
          # The client port opens once the cluster has formed.
          readinessProbe:
            tcpSocket:
              port: client
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "10Gi"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chimaera
  labels:
    app.kubernetes.io/name: chimaera
    app.kubernetes.io/instance: chimaera
spec:
  # Voluntary evictions never take a quorum.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chimaera
      app.kubernetes.io/instance: chimaera
