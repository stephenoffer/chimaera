# Multi-node head-to-head: Ray vs Chimaera on the same 16 machines
# (c7i.4xlarge, 16 vCPU each: 16×16 vCPU in all), one after the other.
#   anyscale job submit -f deploy/anyscale/eval-16node.job.yaml --wait
name: chimaera-eval-16node
cloud: anyscale_v2_default_cloud
compute_config:
  cloud: anyscale_v2_default_cloud
  head_node:
    instance_type: c7i.4xlarge
    # Schedulable head: both runtimes use all 16 machines.
    resources:
      CPU: 16
  worker_nodes:
    - instance_type: c7i.4xlarge
      min_nodes: 15
      max_nodes: 15
working_dir: .
excludes: [".git", "target", ".venv", ".venv-bench", "__pycache__", "*.pyc", "*.so", "results", "dist"]
entrypoint: bash deploy/anyscale/run_eval_multi.sh
# Peers choose raft sync from their disk's measured fsync latency; a second
# Chimaera pass of tasks and actor calls forces fsync, to show its cost.
env_vars:
  EVAL_CHIMAERA_VARIANTS: "CHIMAERA_RAFT_SYNC=fsync"
  # Timed repetitions per workload after a warm-up (the job's hour bounds it).
  EVAL_MIN_SECONDS: "60"
max_retries: 0
timeout_s: 3600
