# Multi-node head-to-head: Ray vs Chimaera on the same 64 machines
# (c7i.4xlarge, 16 vCPU each: 64×16 vCPU in all), one after the other.
#   anyscale job submit -f deploy/anyscale/eval-64node.job.yaml --wait
name: chimaera-eval-64node
cloud: anyscale_v2_default_cloud
compute_config:
  cloud: anyscale_v2_default_cloud
  head_node:
    instance_type: c7i.4xlarge
    # Schedulable head: both runtimes use all 64 machines.
    resources:
      CPU: 16
  worker_nodes:
    - instance_type: c7i.4xlarge
      min_nodes: 63
      max_nodes: 63
working_dir: .
excludes: [".git", "target", ".venv", ".venv-bench", "__pycache__", "*.pyc", "*.so", "results", "dist"]
entrypoint: bash deploy/anyscale/run_eval_multi.sh
# Peers use the default raft sync, fsync: every commit is synced before it
# is acknowledged (docs/configuration.md, CHIMAERA_RAFT_SYNC).
env_vars:
  # Timed repetitions per workload after a warm-up (the job's hour bounds it).
  # 35 s fits both runtimes in the hour at this size.
  EVAL_MIN_SECONDS: "35"
max_retries: 0
timeout_s: 3600
