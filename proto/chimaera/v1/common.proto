syntax = "proto3";
package chimaera.v1;

// Identifiers are 16-byte values carried as `bytes`. chimaera-core wraps them in
// fixed-size newtypes and rejects any other length at decode time.

// A peer process lifetime. A peer that restarts gets a new incarnation, and
// every grant or publication from a retired incarnation is fenced.
message PeerInc {
  bytes peer = 1;
  uint64 inc = 2;
}

// Identifies one logical task (function call, map item, actor call).
message TaskKey {
  bytes run = 1;
  bytes task = 2;
}

// Effect contract of a call. Ordered: a scope or `.options()` may only move it
// upward (stricter).
enum Effects {
  EFFECTS_NONE = 0;        // replayable; retried on infrastructure loss
  EFFECTS_IDEMPOTENT = 1;  // replayable, never speculated
  EFFECTS_EXTERNAL = 2;    // at-most-once start; OutcomeUnknown after a fenced start
}

// What a stored value survives (`durability=` on a call or `ch.put`). The
// class a result was published with is recorded in its ObjectRef.
enum Durability {
  // Copied to CHIMAERA_OBJECT_REPLICAS other peers in the background; a
  // call's result is also made again by running its call (lineage).
  DURABILITY_DEFAULT = 0;
  // No copy, never made again: lost with the peer that wrote it.
  DURABILITY_EPHEMERAL = 1;
  // No copy: made again by running its call when lost.
  DURABILITY_REPLAYABLE = 2;
  // Acknowledged only once copies on other peers, in other failure domains
  // first, are made: the loss of its writer (or its writer's rack) keeps it.
  DURABILITY_RETAINED = 3;
}

// Why object bytes cross from one peer to another. A peer paces what it
// sends (CHIMAERA_MESH_RATE) and shares that rate among these by weight.
enum TrafficClass {
  TRAFFIC_FOREGROUND = 0;  // a running call or a driver reads it now
  TRAFFIC_SHUFFLE = 1;     // a shuffle's gather reads its parts
  TRAFFIC_RECOVERY = 2;    // restoring copies: a drain's hand-off, a Raft snapshot
  TRAFFIC_CHECKPOINT = 3;  // copies made ahead of a loss: replicas, retained puts
}

// A handle to an immutable value. Small values travel inline.
message ObjectRef {
  bytes object_id = 1;
  uint64 size = 2;
  bytes inline_data = 3;
  repeated PeerInc locations = 4;
  bytes checksum = 5;  // blake3, first 16 bytes
  // Number of pickle protocol-5 out-of-band buffers following the main frame.
  uint32 oob_buffers = 6;
  // Run that owns the bytes; a run's objects live under one directory and are
  // reclaimed together when the run expires.
  bytes run = 7;
  // Files of this run that the frame refers to (a result's large buffers,
  // stored apart from it): fetched, placed by and freed with the object.
  repeated ObjectRef blobs = 8;
  // The class it was published with (a retained value's `locations` name
  // its copies too).
  Durability durability = 9;
}

message ErrorRecord {
  enum Kind {
    USER = 0;             // exception raised by user code
    INFRA = 1;            // retries exhausted on infrastructure loss
    OOM = 2;              // out of memory after the OOM escalation budget
    CANCELLED = 3;
    DEADLINE = 4;
    OUTCOME_UNKNOWN = 5;  // external effect may have happened
    CAUSAL = 6;           // a prerequisite failed
    INFEASIBLE = 7;
    WORKER_CRASHED = 8;   // fatal signal on the same input on healthy peers
    DATA_LOST = 9;
    ACTOR_DIED = 10;
    COMMAND_CONFLICT = 11;
    BUDGET = 12;          // its budget, or an enclosing call's, ran out
    OVERLOADED = 13;      // its actor method's mailbox was full (ch.Mailbox)
  }
  Kind kind = 1;
  string type_name = 2;
  string message = 3;
  bytes exc_pickle = 4;   // opaque to Rust; only clients unpickle it
  string traceback = 5;
  TaskKey upstream = 6;   // set for CAUSAL
  uint32 attempt = 7;
  string detail_json = 8; // structured extras: OOM peak/limit, feasibility diff
  uint32 item_index = 9;
}

message Outcome {
  oneof value {
    ObjectRef ok = 1;
    ErrorRecord err = 2;
  }
  uint32 attempt = 3;
  PeerInc peer = 4;
}

// The frozen effective policy of a call. Python merges options (call view,
// scopes, decorator, defaults) and the peer adds the learned layer; the result
// travels with the task and is recorded on every attempt.
message Policy {
  double cpus = 1;              // 0 = learned/default (1)
  uint64 memory = 2;            // reservation, bytes; 0 = learned
  uint64 memory_limit = 3;      // hard cap, bytes; 0 = none
  double gpus = 4;
  string device = 5;            // "" or "cuda", "cuda:H100"
  map<string, double> resources = 6;
  enum Accounting {
    ACCOUNTING_AUTO = 0;
    ACCOUNTING_PROCESS = 1;
    ACCOUNTING_ISOLATED = 2;
  }
  Accounting accounting = 7;
  enum Adaptive {
    ADAPTIVE_ON = 0;
    ADAPTIVE_OBSERVE = 1;
    ADAPTIVE_FROZEN = 2;
  }
  Adaptive adaptive = 8;
  uint32 concurrency = 9;
  uint32 range_size = 10;       // 0 = auto
  bool interactive = 11;        // latency tier: never auto-batched
  bool deterministic = 12;
  string env_digest = 13;
  map<string, string> require = 14;   // hard placement predicates
  repeated string prefer = 15;        // soft placement preferences
  string source = 16;                 // "file.py:line" of the call view, for explanations
  // module.qualname[.method]: a learned profile carries over when the code
  // (and so its digest) changes.
  string fn_name = 17;
  // ch.auto(min=, max=) bounds on learned values; 0 = unbounded.
  double cpus_min = 18;
  double cpus_max = 19;
  uint64 memory_min = 20;
  uint64 memory_max = 21;
  int32 priority = 22;            // higher starts first among ready calls on a peer; never preempts
  uint32 max_in_flight = 23;      // generator calls: items yielded ahead of the consumer; 0 = default
  // A map chunk: the function it runs over its items, and how many items, so
  // the peer learns per-item time and CPU under that function's profile.
  bytes profile_digest = 24;
  uint32 items = 25;
  // budget={...}: the most the call and every call made inside it may use;
  // 0 = no limit. Calls made inside a budgeted call inherit these and the root.
  double budget_cpu_seconds = 26;
  double budget_gpu_seconds = 27;
  TaskKey budget_root = 28;     // the budgeted call; unset on the root itself
  Durability durability = 29;   // what the call's result survives
  // "name=value (where it was set)" for each option not left at its default,
  // sorted by name: ch.context().describe_policy() words the call's options
  // as fn.policy().describe() did where it was made. Sent only for calls made
  // with explain=True; empty otherwise.
  repeated string explained = 30;
  // A gang rank or a reservation bundle: it runs on the resources its peer
  // holds for it (Peer.Hold), not on free capacity.
  LaunchToken launch = 31;
  // Generator calls: the stored bytes the generator may yield ahead of its
  // consumer, which credits by bytes as well as items. 0: a consumer that
  // credits by items only, so the generator waits on items only.
  uint64 max_in_flight_bytes = 32;
  // `cpus` / `memory` is ch.auto(initial=...): the first reservation, which
  // learning may move within cpus_min..cpus_max (memory_min..memory_max).
  // False: a positive value is the caller's, never changed. A peer that
  // predates these fields reads an initial value as the caller's.
  bool cpus_initial = 33;
  bool memory_initial = 34;
}

// One slot of a hold on a peer's resource ledger. The peer starts a call or
// actor carrying it on exactly that slot, and refuses it once the slot was
// taken, the hold expired or was released, or a newer generation of the same
// owner replaced it.
message LaunchToken {
  string owner = 1;       // the gang or reservation that holds it
  uint64 generation = 2;
  uint32 slot = 3;        // index into the hold's slots on that peer
}

// What a function's recent calls used (chimaera_core::profile::Summary).
// Persisted by each peer and gossiped between peers; soft state.
// What more capacity would start sooner on one peer (core/demand.rs): its
// queued calls by shape and expected run time, and when its running calls
// free their cores. Each queued attempt is in one peer's queue at a time, so
// the peers' summaries add up without counting a call twice.
message Demand {
  repeated DemandShape shapes = 1;      // at most 16, most wall time first
  repeated DemandRelease releases = 2;  // cores in use, by when they free up
  uint64 started_total = 3;             // attempts started here since the peer started
  double started_core_s_total = 4;      // their cores × estimated seconds
  double oldest_ready_s = 5;            // the longest any queued call has waited
  uint32 excluded_labels = 6;           // queued calls with hard `require` labels (not in shapes)
  uint32 excluded_devices = 7;          // queued calls needing accelerators (not in shapes)
}

message DemandShape {
  double cpus = 1;
  uint64 memory = 2;     // reserved per call, rounded up to a power of two; 0 = not known yet
  uint32 queued = 3;
  double wall_s = 4;     // estimated wall seconds of those calls, summed
  uint32 cold = 5;       // of them, calls of a function never measured (the estimate is a floor)
  uint32 actors = 6;     // actors waiting for these CPUs: they hold them for their life
}

message DemandRelease {
  double upper_s = 1;    // freed within this many seconds; 0 = not known (an actor, a waiting call)
  double cores = 2;
}

message ProfileSummary {
  bytes fn_digest = 1;
  string method = 2;
  string name = 3;
  uint64 hw_class = 4;
  uint64 n = 5;
  double cores_mean = 6;
  double cores_cv = 7;
  double cpus_granted = 8;
  double wall_p50_s = 9;
  double wall_p90_s = 10;
  uint64 peak_n = 11;
  uint64 peak_p95 = 12;
  double peak_cv = 13;
  uint64 max_arg_bytes = 14;
  bool has_fit = 15;
  double fit_a = 16;
  double fit_b = 17;
  double fit_r2 = 18;
  double fit_resid_cv = 19;
  repeated SizeBucket buckets = 20;
  repeated SizeBucket oom_bounds = 21;
  uint64 out_p90 = 22;
  double learned_cpus = 23;   // CPU grant learned for the function; 0 = none
}

message SizeBucket {
  uint32 bucket = 1;   // log2 size class of the input
  uint64 bytes = 2;
  uint32 samples = 3;
}

message ProfileSnapshot {
  repeated ProfileSummary profiles = 1;
}

// How executors start for a run: interpreter, working directory, import path
// and environment. Stored in the run record so a restarted peer can resume
// the run's work.
message ExecEnvSpec {
  string python = 1;
  string cwd = 2;
  repeated string sys_path = 3;
  map<string, string> env = 4;
}
