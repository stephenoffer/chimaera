syntax = "proto3";
package chimaera.v1;

import "chimaera/v1/common.proto";

// ---------------------------------------------------------------------------
// Replicated shard state. Every record here lives in a Raft group's state
// machine and is produced only by `chimaera_core::shard::ShardState::apply`.
// ---------------------------------------------------------------------------

enum CallKind {
  CALL_FUNCTION = 0;
  CALL_ACTOR_CTOR = 1;
  CALL_ACTOR_METHOD = 2;
  CALL_MAP_ITEM = 3;
}

message TaskSpec {
  TaskKey key = 1;
  CallKind kind = 2;
  bytes fn_digest = 3;          // content digest of the shipped code blob
  ObjectRef args = 4;           // pickled call frame, futures replaced by placeholders
  repeated TaskKey deps = 5;    // outcomes this call consumes
  Effects effects = 6;
  uint32 max_attempts = 7;      // includes the first attempt
  uint64 deadline_hlc = 8;      // 0 = none
  bytes policy = 9;             // frozen effective policy, opaque to the shard
  bytes actor = 10;             // actor id for CALL_ACTOR_*
  uint64 handle = 11;           // submitting handle, for per-handle ordering
  uint64 seq = 12;
  string method = 13;
  uint32 item_index = 14;
  TaskKey parent = 15;
  bool speculation_allowed = 16;  // effects NONE and deterministic
  uint32 max_oom_escalations = 17;
  repeated string retry_exception_types = 18;
  // Content-addressed values the call reads (large arguments, put handles),
  // so the peer that runs it can fetch them and placement can weigh them.
  repeated ObjectRef blobs = 19;
  // Durable actor calls: the command's idempotency key (default: the task
  // key). Repeating it with the same arguments returns the stored reply.
  bytes command_id = 20;
  // Digest of the method and its pickled arguments: a reused command id
  // with a different fingerprint is a CommandConflict.
  bytes command_fingerprint = 21;
  // A generator call: items stream to the caller as they are yielded; the
  // outcome is the item count. Runs on the caller's peer.
  bool stream = 22;
  // An actor call: the previous call on the same handle (seq - 1). A host that
  // has not seen this handle (the actor restarted or moved there) runs this
  // call once that one is finished, rather than waiting for seq 0.
  TaskKey prev = 23;
  // A call that already ran on the direct path (an actor's executor answered
  // its caller itself): recorded as done with this outcome, never placed.
  Ran ran = 24;
  // Sent straight to its actor's executor: the peer only notes it as in
  // flight there (explain, deadlock messages) until its `ran` record
  // arrives. Never submitted to a shard.
  bool direct = 25;
  // A durable workflow's call as the workflow describes it (JSON: its step,
  // function, call site, argument preview and fingerprint), opaque to the
  // shard: a replay that makes another call at this step is rejected with
  // the recorded description and its own.
  string workflow_step = 26;
}

// What the direct path reports for a call it ran (TaskSpec.ran).
message Ran {
  Outcome outcome = 1;
  uint64 entry_unix_ns = 2;
  uint64 exit_unix_ns = 3;
  uint64 cpu_ns = 4;      // the executor process's CPU time during the call
  uint32 executor = 5;
  // The generation of the actor's instance that ran it (ActorRecord.generation;
  // 0 = not known, as from an older peer, or settled by its caller unseen),
  // which its attempt names. Its caller already has the outcome, so the shard
  // keeps it whatever the actor's generation is when the record lands.
  uint64 actor_generation = 6;
}

message Attempt {
  uint32 attempt = 1;
  PeerInc peer = 2;
  bool revoked = 3;
  bool speculative = 4;
}

message TaskRecord {
  enum State {
    PENDING = 0;  // waiting on dependencies
    READY = 1;    // runnable, not granted
    RUNNING = 2;  // at least one live attempt
    DONE = 3;     // outcome committed, immutable
  }
  TaskSpec spec = 1;
  State state = 2;
  uint32 deps_remaining = 3;
  uint32 infra_failures = 4;
  uint32 oom_failures = 5;
  uint32 user_retries = 6;
  repeated Attempt attempts = 7;
  uint32 next_attempt = 8;
  uint32 external_started_attempt = 9;  // 0 = no start consumed
  Outcome outcome = 10;
  uint32 pins = 11;
  uint64 submitted_hlc = 12;
  uint64 done_hlc = 13;
  bytes last_fingerprint = 14;
  uint64 memory_hint = 15;              // raised after OOM, bytes
  repeated ErrorRecord failure_history = 16;  // bounded, newest last
  TaskKey forwarded_to = 17;            // waiting for this call's outcome (see PublishEntry.forward_to)
  // The peer its submission asked to run it (SubmitTasks.grant_to) while it
  // still waited on dependencies: granted there in the commit that satisfies
  // them, instead of a placement round and a second commit.
  PeerInc grant_on_ready = 18;
}

// A TaskRecord's state and outcome alone: the same field numbers, so a
// stored record decodes as this while skipping its spec, arguments and
// attempts (reading a dependency's outcome happens once per edge).
message TaskRecordOutcome {
  TaskRecord.State state = 2;
  Outcome outcome = 10;
}

message RunRecord {
  enum State {
    ACTIVE = 0;
    FINISHED = 1;
    CANCELLED = 2;
  }
  bytes run = 1;
  string tenant = 2;
  string submission_key = 3;
  State state = 4;
  bool detached = 5;
  uint64 client_grace_ms = 6;
  uint64 created_hlc = 7;
  uint64 finished_hlc = 8;
  uint64 retention_ms = 9;
  bytes code_digest = 10;
  bytes env_digest = 11;
  string description = 12;
  ExecEnvSpec exec_env = 13;
  // The peer the run was created on: where its driver listens for output.
  PeerInc home = 14;
  // Vshards holding a copy of this record, the run's own first. A run's
  // top-level calls are spread over them (in different groups), so no single
  // group leader commits every call of a large run. Empty: only the run's own.
  repeated uint32 spread = 15;
}

message ActorSpec {
  bytes actor = 1;
  TaskKey ctor = 2;           // constructor task; its outcome gates method calls
  string tenant = 3;
  string key = 4;             // stable name for keyed actors, empty otherwise
  bytes class_digest = 5;
  enum Restart {
    RESTART_NEVER = 0;
    RESTART_FRESH = 1;
    RESTART_CHECKPOINT = 2;
  }
  Restart restart = 6;
  bool durable = 7;           // keyed durable state with a command log
  uint32 max_restarts = 8;
  bytes policy = 9;
  bool detached = 10;
  // An unnamed actor's id is its creating run's child ("actor", nonce), so no
  // such id is ever another's (a named actor's comes from tenant and name).
  bytes nonce = 11;
  // ch.durable.State(version=): the version of the durable state its class
  // writes. Creating a named durable actor that exists with a lower one binds
  // the actor to the new class (ActorUpgrade).
  uint32 state_schema = 12;
  // Per-method limits on the actor's calls (MethodLimit): a method's
  // ch.Mailbox, and a batched method's queue. (A list, not a map: a record
  // must encode to the same bytes on every replica.)
  repeated MethodLimit methods = 13;
}

// How many calls of one actor method its actor may have at once, and what
// becomes of a call past that. A mailbox (`reject`, or a `max_wait_ms`)
// counts the method's calls queued at the actor's peer and those its process
// holds (running, or waiting there for a thread); a batched method's queue
// (neither) counts only those its process holds, and the rest wait at the
// peer. Calls of a limited method do not wait for the actor's other calls'
// room, so they cannot hold up its other methods.
message MethodLimit {
  string method = 1;
  uint32 max_calls = 2;     // 0 = no limit on their number
  uint64 max_bytes = 3;     // on their argument bytes; 0 = none (a larger call goes alone)
  bool reject = 4;          // a call past the limit fails at once (OVERLOADED)
  uint64 max_wait_ms = 5;   // else it waits for room this long, then fails; 0 = no bound
}

message ActorRecord {
  enum State {
    PENDING = 0;     // waiting for placement
    ALIVE = 1;
    RESTARTING = 2;
    DEAD = 3;
  }
  ActorSpec spec = 1;
  State state = 2;
  uint64 generation = 3;
  PeerInc host = 4;
  uint32 restarts = 5;
  uint64 state_version = 6;       // durable actors
  bytes durable_state = 7;        // durable actors, <= 1 MiB inline
  uint64 checkpoint_version = 8;
  ObjectRef checkpoint = 9;       // restart=checkpoint snapshot
  ErrorRecord death = 10;
  uint64 commands_retained = 11;
  // Durable state too large to keep inline: the digests of its chunks, in
  // order (each stored once per actor, keys::actor_chunk). ActorCommitRoot
  // replaces the list whole; `durable_state` is then empty.
  repeated bytes state_chunks = 12;
}

message ActorCommandRecord {
  bytes cmd_id = 1;
  bytes fingerprint = 2;
  uint64 version = 3;
  ObjectRef reply = 4;
  uint64 committed_hlc = 5;
}

// ---------------------------------------------------------------------------
// Commands. A command is applied deterministically: no wall clock, no
// randomness, ordered iteration only. `hlc` is assigned by the proposing
// leader and clamped to be monotonic at apply time.
// ---------------------------------------------------------------------------

message ShardCmd {
  uint32 vshard = 1;
  uint64 vshard_epoch = 2;
  PeerInc issuer = 3;
  uint64 hlc = 4;
  oneof body {
    RunCreate run_create = 10;
    SubmitTasks submit_tasks = 11;
    GrantAttempts grant = 12;
    StartExternal start_external = 13;
    PublishResults publish = 14;
    RecordFailure record_failure = 15;
    Cancel cancel = 16;
    Subscribe subscribe = 17;
    DepNotify dep_notify = 18;
    OutboxAck outbox_ack = 19;
    Release release = 20;
    RetireIncarnation retire = 21;
    ActorCreate actor_create = 22;
    ActorPlace actor_place = 23;
    ActorDied actor_died = 24;
    ActorCommandCommit actor_commit = 25;
    ActorCheckpoint actor_checkpoint = 26;
    RunFinish run_finish = 27;
    Gc gc = 28;
    AdoptVShard adopt_vshard = 29;
    CancelRun cancel_run = 30;
    StoreWrite store_write = 31;
    StoreRead store_read = 32;
    Charge charge = 33;
    // A subscribing vshard no longer reads the producer (sent through the outbox).
    Subscribe unsubscribe = 34;
    // Calls here that cancelled calls in another vshard submitted (sent through the outbox).
    CancelChildren cancel_children = 35;
    // Forget dead letters (retried elsewhere, or not wanted), releasing their inputs.
    Release discard_dead = 36;
    StoreTxn store_txn = 37;
    // A chunk of a durable actor's state, written before the commit that names it.
    ActorChunkPut actor_chunk_put = 38;
    // A durable actor command whose state is in chunks (ActorRecord.state_chunks).
    ActorCommitRoot actor_commit_root = 39;
    // Bind a named durable actor to a class that writes a newer state version.
    ActorUpgrade actor_upgrade = 40;
    // A session holds (or releases) stored files of a run that is not its own.
    LeaseObjects lease_objects = 41;
    StoreClaim store_claim = 42;
  }
}

// A call that failed for good, kept so it can be retried (Run.failed()): its
// spec with its arguments, its error, and when it ended. Its inputs stay
// pinned until it is discarded, pushed out by newer ones, or its run ends.
message DeadLetter {
  TaskSpec spec = 1;
  Outcome error = 2;
  uint64 done_hlc = 3;
}

message RunCreate {
  RunRecord run = 1;
}

message SubmitTasks {
  repeated TaskSpec tasks = 1;
  // Optimistic first grant: the ingress peer is already running attempt 1.
  PeerInc grant_to = 2;
}

message Grant {
  TaskKey task = 1;
  PeerInc peer = 2;
  bool speculative = 3;
}

message GrantAttempts {
  repeated Grant grants = 1;
}

message StartExternal {
  TaskKey task = 1;
  uint32 attempt = 2;
  PeerInc peer = 3;
}

message PublishEntry {
  TaskKey task = 1;
  uint32 attempt = 2;
  PeerInc peer = 3;
  Outcome outcome = 4;
  // The attempt returned another call's future instead of a value: the task
  // completes with that call's outcome, without holding a worker meanwhile.
  TaskKey forward_to = 5;
}

message PublishResults {
  repeated PublishEntry entries = 1;
}

message RecordFailure {
  enum Kind {
    INFRA = 0;
    OOM = 1;
    RETRYABLE_USER = 2;
    // The peer gives back an attempt it never started (to move queued work
    // to another peer): not a failure, nothing is counted.
    REQUEUED = 3;
  }
  TaskKey task = 1;
  uint32 attempt = 2;
  PeerInc peer = 3;
  Kind kind = 4;
  ErrorRecord error = 5;
  bytes fingerprint = 6;
  uint64 memory_peak = 7;
}

message Cancel {
  TaskKey task = 1;
  ErrorRecord.Kind reason = 2;  // CANCELLED or DEADLINE
  string message = 3;
}

// Cancelled calls whose children may live in the run's own vshard: actor and
// generator calls a call makes stay there when the call itself was spread to
// another vshard. That vshard cancels them, and remembers the cancellation so
// calls a cancelled body submits afterwards fail at once.
message CancelChildren {
  repeated TaskKey parents = 1;
  ErrorRecord.Kind reason = 2;
  string message = 3;
}

// Usage charged to a budgeted call (the root) by the peers running it or
// calls made inside it. Past a limit the shard cancels the root and
// everything it submitted, with kind BUDGET. The limits travel with each
// charge, so the shard never reads the opaque policy.
message Charge {
  TaskKey root = 1;
  double cpu_seconds = 2;
  double gpu_seconds = 3;
  double limit_cpu_seconds = 4;   // 0 = no limit
  double limit_gpu_seconds = 5;
}

message CancelRun {
  bytes run = 1;
  string message = 2;
  bytes after = 3;  // a long run's next page of tasks starts after this task key
}

// Ask the producer's vshard to notify `subscriber_vshard` when it completes.
message Subscribe {
  TaskKey producer = 1;
  uint32 subscriber_vshard = 2;
  // Which of the subscriber's holds this is: an Unsubscribe for an older one
  // than the producer last saw is stale.
  uint32 hold = 3;
}

message DepNotify {
  TaskKey producer = 1;
  Outcome outcome = 2;
}

message OutboxAck {
  repeated uint64 seqs = 1;
}

message Release {
  repeated TaskKey tasks = 1;
}

message RetireIncarnation {
  PeerInc peer = 1;
}

message ActorCreate {
  ActorSpec spec = 1;
}

message ActorPlace {
  bytes actor = 1;
  uint64 expected_generation = 2;
  PeerInc host = 3;
}

message ActorDied {
  bytes actor = 1;
  uint64 generation = 2;
  ErrorRecord reason = 3;
  // Ended on purpose (closed by its owner, or its run ended): never restarted.
  bool terminal = 4;
  // Its host is draining: a restartable actor starts elsewhere without the
  // move counting against its max_restarts.
  bool moved = 5;
}

message ActorCommandCommit {
  bytes actor = 1;
  uint64 generation = 2;
  bytes cmd_id = 3;
  bytes fingerprint = 4;
  uint64 prev_version = 5;
  bytes new_state = 6;
  ObjectRef reply = 7;
}

message ActorCheckpoint {
  bytes actor = 1;
  uint64 generation = 2;
  uint64 version = 3;
  ObjectRef snapshot = 4;
}

// Stored under the blake3 digest of `data` for this actor. Refused unless
// `generation` is the actor's current one, so an instance that was replaced
// cannot write. Chunks no commit names are dropped by the next commit or
// placement of the actor.
message ActorChunkPut {
  bytes actor = 1;
  uint64 generation = 2;
  bytes data = 3;           // at most MAX_INLINE_STATE bytes
}

// As ActorCommandCommit (whose new_state stays empty), with the state given
// as the digests of chunks already put. Refused if one is missing; otherwise
// the record's chunk list is replaced in the same step, so a restore reads
// either the old list or the new one, never a mixture.
message ActorCommitRoot {
  ActorCommandCommit commit = 1;
  repeated bytes chunks = 2;
}

// Applied only to a live durable actor whose class writes an older state
// version: the record then names `class_digest` and its `methods` limits,
// and its host rebuilds the instance from the committed state with that
// class (whose State(migrate=) converts it).
message ActorUpgrade {
  bytes actor = 1;
  bytes class_digest = 2;
  uint32 state_schema = 3;
  repeated MethodLimit methods = 4;
}

message RunFinish {
  bytes run = 1;
  RunRecord.State state = 2;
}

message Gc {
  uint32 max_keys = 1;
}

// A session's hold on stored files of a run (a ch.put handle unpickled where
// another run is current). A held value outlives its run's end, until its
// last holder releases it, or the holder's session ends, or its peer
// incarnation is retired. Leases live in the run's own vshard.
message LeaseObjects {
  bytes run = 1;
  repeated bytes object_ids = 2;   // the value's file and the files it links
  PeerInc peer = 3;                // the holder's peer incarnation
  uint64 holder = 4;               // the holder on that peer
  bool release = 5;
}

// Directory-driven ownership: this group serves `vshards` at `epoch`.
message AdoptVShard {
  repeated uint32 vshards = 1;
  uint64 epoch = 2;
}

// ---------------------------------------------------------------------------
// Replies
// ---------------------------------------------------------------------------

message TaskAck {
  enum Status {
    ACCEPTED = 0;
    DUPLICATE = 1;     // already known; `state` and `outcome` are current
    REJECTED = 2;
    PUBLISHED = 3;
    EXISTING = 4;      // an outcome was already committed; it is returned
    STALE = 5;         // fenced: retired incarnation or revoked attempt
    GRANTED = 6;
    DENIED = 7;
    NOT_FOUND = 8;
  }
  TaskKey task = 1;
  Status status = 2;
  TaskRecord.State state = 3;
  Outcome outcome = 4;
  uint32 attempt = 5;
  string reason = 6;
}

message ActorAck {
  enum Status {
    OK = 0;
    EXISTING = 1;
    STALE_GENERATION = 2;
    DUPLICATE = 3;        // same command id and fingerprint: stored reply
    CONFLICT = 4;         // same command id, different fingerprint
    VERSION_CONFLICT = 5;
    NOT_FOUND = 6;
    DEAD = 7;
    REJECTED = 8;         // not durable, or state over the inline limit
  }
  bytes actor = 1;
  Status status = 2;
  ActorRecord record = 3;
  ObjectRef reply = 4;
  uint64 version = 5;
  string reason = 6;
}

message ShardReply {
  oneof body {
    RunRecord run = 1;
    TaskAcks tasks = 2;
    ActorAck actor = 3;
    uint64 count = 4;
    string rejected = 5;  // envelope rejected: vshard not owned, stale epoch, retired issuer
    StoreReply store = 6;
  }
}

message TaskAcks {
  repeated TaskAck acks = 1;
}

// A cross-vshard dependency notification waiting to be delivered by the
// producer group's leader. Removed by OutboxAck after the target commits it.
message OutboxEntry {
  uint64 seq = 1;
  uint32 target_vshard = 2;
  DepNotify notify = 3;
  // Set instead of notify: release the subscriber's hold on a producer.
  Subscribe unsubscribe = 4;
  // Set instead of notify: cancel the calls cancelled calls submitted there.
  CancelChildren cancel_children = 5;
}

// Ownership of one virtual shard by this group.
message VShardOwnership {
  uint32 vshard = 1;
  uint64 epoch = 2;
}

// ---- ch.Store: replicated keys, leases, counters, barriers ----------------
//
// A namespace lives in one vshard (hash of tenant and namespace), so reads and
// writes across its keys are linearizable. Every change bumps the namespace's
// revision, which versions entries and positions watches.

message StoreEntry {
  string key = 1;
  bytes value = 2;          // opaque to Rust (pickled by the client), at most 1 MiB
  uint64 version = 3;       // namespace revision of its last change
  uint64 created = 4;       // revision that created it
  uint64 expires_hlc = 5;   // 0 = never
  bool is_counter = 6;
  int64 counter = 7;
}

message StoreLease {
  string holder = 1;
  uint64 token = 2;         // fencing token: grows with every grant
  uint64 expires_hlc = 3;
  string item = 4;          // a claim (StoreClaim): the key it holds
  string items = 5;         // and the prefix that key was claimed from
}

message StoreBarrier {
  uint32 parties = 1;
  uint32 arrived = 2;
  uint64 generation = 3;    // completed rounds
}

message StoreChange {
  uint64 revision = 1;
  string key = 2;
  bool deleted = 3;
  bytes value = 4;
  bool is_counter = 5;
  int64 counter = 6;
}

message StoreFence {
  string lock = 1;
  uint64 token = 2;
}

message StoreWrite {
  enum Op {
    PUT = 0;
    DELETE = 1;
    ADD = 2;      // counter += delta
    LOCK = 3;
    RENEW = 4;
    UNLOCK = 5;
    ARRIVE = 6;   // barrier
  }
  string tenant = 1;
  string namespace = 2;
  Op op = 3;
  string key = 4;
  bytes value = 5;
  bool has_if_version = 6;
  uint64 if_version = 7;    // 0 = the key must not exist
  uint64 ttl_ms = 8;
  int64 delta = 9;
  string holder = 10;       // LOCK, RENEW, UNLOCK
  uint64 token = 11;        // RENEW, UNLOCK
  uint32 parties = 12;      // ARRIVE
  StoreFence fence = 13;    // reject the write unless this lease is still held
}

// Writes to several keys of one namespace that apply together or not at all.
// Every condition is tested first: each check, and each op's own if_version,
// fence and limits. Then the ops apply in order as one new revision, each
// logging its own change. Ops are PUT, DELETE or ADD, each on a different key;
// their tenant and namespace fields are not used.
message StoreTxn {
  string tenant = 1;
  string namespace = 2;
  repeated StoreCheck checks = 3;
  repeated StoreWrite ops = 4;
}

// A StoreTxn condition: `key` is at `version` (0 = it does not exist).
message StoreCheck {
  string key = 1;
  uint64 version = 2;
}

// Claim a key under `prefix` that nobody holds (a work queue's next item):
// grant `holder` the lease lock_prefix + key for ttl_ms. An item claimed
// before and given back or lapsed goes first, then the first key never
// claimed. The namespace keeps an index of claims by when they lapse, so a
// claim looks at a few keys, however many are queued or held; renewing or
// unlocking the lease keeps that index current.
message StoreClaim {
  string tenant = 1;
  string namespace = 2;
  string prefix = 3;
  string lock_prefix = 4;
  string holder = 5;
  uint64 ttl_ms = 6;
}

message StoreRead {
  enum Kind {
    GET = 0;
    SCAN = 1;
    CHANGES = 2;   // changes with revision > after_revision (watch)
    LEASE = 3;
    BARRIER = 4;
  }
  string tenant = 1;
  string namespace = 2;
  Kind kind = 3;
  string key = 4;           // GET, LEASE, BARRIER; SCAN and CHANGES: the prefix
  uint64 after_revision = 5;
  string start_after = 6;   // SCAN paging
  uint32 limit = 7;
  bool keys_only = 8;       // SCAN: leave values out
}

message StoreReply {
  bool ok = 1;
  string error = 2;         // why not: version mismatch, held, fenced, ...
  uint64 revision = 3;      // the namespace's revision after this command
  StoreEntry entry = 4;
  repeated StoreEntry entries = 5;
  StoreLease lease = 6;
  StoreBarrier barrier = 7;
  repeated StoreChange changes = 8;
  bool compacted = 9;       // changes after after_revision were trimmed: scan again
  bool more = 10;           // StoreClaim: keys are left under the prefix, all claimed
  uint32 examined = 11;     // StoreClaim: index entries and keys it looked at
  uint64 retry_ms = 12;     // StoreClaim, nothing claimable: until the first claim held lapses (0: none)
}
