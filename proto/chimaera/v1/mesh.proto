syntax = "proto3";
package chimaera.v1;

import "chimaera/v1/common.proto";
import "chimaera/v1/shard.proto";
import "chimaera/v1/client.proto";

// Peer <-> peer. Raft traffic, forwarded proposals, work pushed by a group
// leader to the peer it placed it on, object bytes, and liveness. Every call
// carries the cluster id so peers of different clusters never mix.

service Mesh {
  // Exchange member records while forming or joining a cluster.
  rpc Join(JoinRequest) returns (JoinReply);
  // One openraft RPC (postcard body) for a group hosted on the target.
  rpc Raft(RaftRequest) returns (RaftReply);
  // A raft snapshot, streamed: the first chunk carries the header, the rest
  // the file in pieces, so its size is never bound by one message's limit.
  rpc InstallSnapshot(stream SnapshotChunk) returns (RaftReply);
  // Propose a shard command on the target's replica of its group.
  rpc Propose(ProposeRequest) returns (ProposeReply);
  // Read records of a group hosted on the target.
  rpc Read(ReadRequest) returns (ReadReply);
  // Granted attempts placed on the target, and actor records it hosts.
  rpc Dispatch(DispatchRequest) returns (DispatchReply);
  // Stream an object's bytes from the target's store.
  rpc Fetch(FetchRequest) returns (stream FetchChunk);
  // Outcomes of tasks in groups the target hosts, as they commit.
  rpc Watch(WatchRequest) returns (stream OutcomeEvent);
  // Liveness probe; the reply carries the target's load.
  rpc Ping(PingRequest) returns (PingReply);
  // Stop work on tasks that ended elsewhere, and drop objects.
  rpc Forget(ForgetRequest) returns (ForgetReply);
  // Store a code blob here too, so the code outlives the peer it came in on.
  rpc PutCode(MeshPutCode) returns (PutCodeReply);
  // Output of calls that ran on the sender, for the run's home peer.
  rpc PushLogs(PushLogsRequest) returns (PushLogsReply);
  // The receiver's copy of a run's output (`chimaera logs` asked at another peer).
  rpc Logs(MeshLogsRequest) returns (LogsReply);
  // Keep a copy of an object the sender just stored (on the target's disk),
  // so the object outlives the sender. Answered at once, the copy following,
  // or with `wait` once the copy is made.
  rpc Replicate(ReplicateRequest) returns (ReplicateReply);
  // What this peer's object store holds (`chimaera objects --cluster`).
  rpc Inventory(InventoryRequest) returns (InventoryReply);
  // Hold resources on the target's ledger (Peer.Hold asked at another peer).
  rpc Hold(HoldRequest) returns (HoldReply);
  // Why an actor placed on this peer has not started ("" if it is not
  // waiting): explain() on another peer asks the actor's host.
  rpc ActorWait(ActorWaitRequest) returns (ActorWaitReply);
  // The attempts of a call this peer ran, as it recorded them (explain).
  rpc Attempts(AttemptsRequest) returns (AttemptsReply);
}

message ActorWaitRequest {
  string cluster = 1;
  bytes actor = 2;
}

message ActorWaitReply {
  string reason = 1;
}

message AttemptsRequest {
  string cluster = 1;
  TaskKey task = 2;
}

message AttemptsReply {
  repeated AttemptRecord attempts = 1;
}

message InventoryRequest {
  string cluster = 1;
  uint32 largest = 2;  // how many of its largest objects to list (objplane::listed)
}

message InventoryReply {
  string json = 1;  // chimaera-peer objplane::inventory
}

message ReplicateRequest {
  string cluster = 1;
  bytes run = 2;
  bytes object_id = 3;
  uint64 size = 4;
  uint64 from_node = 5;  // the sender, which holds the object
  bool wait = 6;         // answer once the copy is made (an error if it failed), not at once
  // TRAFFIC_RECOVERY for a drain's hand-off; any other: a checkpoint copy.
  TrafficClass traffic = 7;
}

message ReplicateReply {}

message PushLogsRequest {
  string cluster = 1;
  bytes run = 2;
  repeated LogEvent lines = 3;
}

message PushLogsReply {}

message MeshLogsRequest {
  string cluster = 1;
  LogsRequest logs = 2;
}

message Member {
  bytes peer = 1;
  uint64 incarnation = 2;
  uint64 node_id = 3;
  string addr = 4;       // host:port other peers dial
  double cpus = 5;
  uint64 memory_bytes = 6;
  repeated string gpus = 7;
  map<string, string> labels = 8;   // for Placement(require=, prefer=)
  string host = 9;        // the machine (its boot id, or CHIMAERA_MACHINE_ID): peers with the same one share it
  string object_dir = 10; // this peer's object store, which a peer on the same machine may read directly
  RaftSync raft_sync = 11; // how it writes its raft log: what a commit it acknowledges survives
  // The newest layout of stored results it (and its executors) read: 1, a
  // shuffle scatter's sparse buckets. 0: a peer too old to say, which reads
  // only the older layouts, so no peer writes the newer while it is live.
  uint32 object_layout = 12;
}

// How a cluster peer writes its raft log (CHIMAERA_RAFT_SYNC).
enum RaftSync {
  RAFT_SYNC_UNKNOWN = 0;  // a peer too old to say: counts as not syncing
  RAFT_SYNC_OFF = 1;      // page cache only: survives the peer's process dying, not its machine
  RAFT_SYNC_FSYNC = 2;
  RAFT_SYNC_FULL = 3;     // fsync that also flushes the drive's cache
}

message JoinRequest {
  string cluster = 1;
  Member member = 2;
  uint32 bootstrap_expect = 3;
}

message JoinReply {
  repeated Member members = 1;   // everyone the target knows, including itself
  // Set once the cluster has formed: the plan a late joiner adopts.
  ClusterPlan plan = 2;
}

// Deterministic layout computed from the founding members.
message ClusterPlan {
  string cluster = 1;
  uint32 data_groups = 2;               // groups 1..=data_groups own vshards
  repeated uint64 directory_voters = 3; // group 0
  repeated GroupVoters groups = 4;
  repeated Member founders = 5;
}

message GroupVoters {
  uint32 group = 1;
  repeated uint64 voters = 2;
}

message RaftRequest {
  string cluster = 1;
  uint32 group = 2;
  uint32 kind = 3;
  bytes body = 4;
  // The node it is for. A peer that restarted under a new identity at the
  // old one's address refuses it (0: not stated).
  uint64 target = 5;
}

message RaftReply {
  bytes body = 1;
}

message SnapshotChunk {
  string cluster = 1;  // first chunk only
  uint32 group = 2;    // first chunk only
  bytes header = 3;    // first chunk only: postcard (vote, snapshot meta)
  uint64 size = 4;     // first chunk only: the file's length
  bytes data = 5;
  uint64 target = 6;   // first chunk only: the node it is for (see RaftRequest)
}

message ProposeRequest {
  string cluster = 1;
  uint32 group = 2;
  ShardCmd cmd = 3;
}

message ProposeReply {
  ShardReply reply = 1;
  bool not_leader = 2;
  uint64 leader_hint = 3;   // node id, 0 when unknown
  string error = 4;
}

message ReadRequest {
  string cluster = 1;
  repeated TaskKey tasks = 2;
  bytes run = 3;
  bytes actor = 4;
  bool linearizable = 5;
  // With limit > 0: one page of `run`'s tasks after `after_task`.
  bytes after_task = 6;
  uint32 limit = 7;
  // > 0: list the runs whose records group `list_runs_group` holds (`chimaera runs`).
  uint32 list_runs_group = 8;
  // > 0: list the actors whose records group `list_actors_group` holds.
  uint32 list_actors_group = 9;
  // Ask group `membership_group`'s leader for its members (only the leader
  // answers): a replica that stopped hearing from it checks it was not removed.
  bool membership = 10;
  uint32 membership_group = 11;
  // `run`'s dead letters in vshard `failed_vshard`.
  bool failed = 12;
  uint32 failed_vshard = 13;
  // A read of this replica's copy of a store namespace (ReadReply.store): it
  // takes no log entry, and may lag the leader's.
  StoreRead store = 14;
}

message ReadReply {
  repeated TaskRecord tasks = 1;  // same order as requested; empty record if absent
  RunRecord run = 2;
  ActorRecord actor = 3;
  string error = 4;
  repeated TaskKey page_keys = 5;   // keys of `tasks` in page mode
  repeated RunRecord runs = 6;      // list_runs_group's runs, without exec_env
  repeated ActorRecord actors = 7;  // list_actors_group's actors
  repeated uint64 members = 8;      // membership_group's voters and learners
  repeated DeadLetter failed = 9;   // with `failed`: the dead letters
  repeated TaskKey failed_keys = 10;
  StoreReply store = 11;            // with `store`
}

// An attempt the leader granted to the target, with everything needed to run
// it without reading the task's group.
message RemoteWork {
  TaskKey task = 1;
  uint32 attempt = 2;
  TaskSpec spec = 3;
  repeated Outcome deps = 4;
  ExecEnvSpec env = 5;
  bool detached = 6;
  // Re-run a restarted actor's committed constructor without publishing.
  bool replay = 7;
  // The reservation the placer chose (learned or requested); 0 = unknown.
  double cpus = 8;
  uint64 memory = 9;
  // The run's home peer, where its output goes: the target may hold no
  // replica of the run's group to read it from. Empty = unknown.
  bytes home = 10;
}

message DispatchRequest {
  string cluster = 1;
  repeated RemoteWork work = 2;
  // Current records of actors the target hosts (placement, restarts, death).
  repeated ActorRecord actors = 3;
  ExecEnvSpec actor_env = 4;
}

message DispatchReply {
  uint32 accepted = 1;
}

message FetchRequest {
  string cluster = 1;
  bytes run = 2;
  bytes object_id = 3;   // or, with `code`, the code blob's digest
  bool code = 4;
  // A byte range (parallel fetches of large objects); len 0 = to the end.
  uint64 offset = 5;
  uint64 len = 6;
  TrafficClass traffic = 7;  // the class the sender paces these bytes as
}

message FetchChunk {
  bytes data = 1;
  uint64 total = 2;      // set on the first chunk: bytes in the requested range
  bytes checksum = 3;    // blake3 of `data`, first 16 bytes
  uint64 object_size = 4;  // set on the first chunk: the whole object's size
}

message WatchRequest {
  string cluster = 1;
  repeated TaskKey tasks = 2;
}

message PingRequest {
  string cluster = 1;
  uint64 from_node = 2;
  // SWIM membership claims gossiped with the probe.
  repeated SwimUpdate updates = 3;
  // Indirect probe: the receiver probes this node and reports `relay_ok`.
  uint64 relay_to = 4;
}

// A membership claim. `inc` is the process incarnation in the high 32 bits
// and refutations in the low 32. Alive claims carry the member record, so a
// peer can reach a member it learns of by gossip.
message SwimUpdate {
  uint64 node = 1;
  uint64 inc = 2;
  uint32 state = 3;   // 0 alive, 1 suspect, 2 dead
  Member member = 4;
}

message PingReply {
  uint64 node_id = 1;
  uint64 incarnation = 2;
  double cpus = 3;
  double cpu_used = 4;
  uint32 queued = 5;
  uint32 running = 6;
  repeated uint32 leading = 7;   // groups the target leads
  uint32 actors = 8;             // actor instances hosted
  bool draining = 9;             // shutting down: place nothing new there
  // Memory pool (executor charges plus objects in tmpfs), in bytes.
  uint64 memory_pool = 10;
  uint64 memory_used = 11;
  uint64 memory_available = 12;  // what the OS can hand out now
  uint64 object_bytes = 13;
  // Profiles changed since the last reply to the asking peer.
  repeated ProfileSummary profiles = 14;
  // Blobs this peer fetched or wrote recently (locality hints).
  repeated bytes recent_blobs = 15;
  repeated SwimUpdate updates = 16;
  bool relay_ok = 17;    // indirect probe: the target answered the relay
  // CPUs this peer's running calls hold per tenant that has a cluster share
  // (CHIMAERA_TENANT_SHARES); the others add these up when admitting.
  map<string, double> tenant_cpu = 18;
  // The peer is draining (SIGTERM): it will stop. `draining` alone may also
  // mean its core has not answered yet (see the ping handler).
  bool stopping = 19;
  // Unused: peers from this version on neither set nor read it, and an older
  // peer's value is ignored. It carried CPUs that threads of waiting calls
  // kept, per tenant; that change was taken back. Keep the field and never
  // reuse number 20.
  map<string, double> tenant_kept = 20;
  Demand demand = 21;  // what more capacity would start sooner here
}

message ForgetRequest {
  string cluster = 1;
  repeated TaskKey tasks = 2;   // ended: stop queued or running attempts
  repeated ObjectRef objects = 3;
  bytes run = 4;
  bool run_expired = 5;         // drop all of the run's objects
  bool run_ended = 6;           // end the run's actors hosted here
  // Records of actor calls that ended without running on their host.
  repeated TaskRecord ended = 7;
  // With run_ended: the run's values that sessions hold (LeaseObjects), kept.
  repeated bytes kept = 8;
}

message ForgetReply {}

message MeshPutCode {
  string cluster = 1;
  bytes digest = 2;
  bytes code = 3;
}
