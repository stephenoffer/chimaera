syntax = "proto3";
package chimaera.v1;

import "chimaera/v1/common.proto";
import "chimaera/v1/shard.proto";

// Client <-> peer. The same service serves a local client over a Unix socket
// and a remote client over TLS. Any peer can serve any run: requests route by
// the ids, which embed their vshard.

service Peer {
  rpc Hello(ClientHello) returns (PeerInfo);
  rpc CreateRun(CreateRunRequest) returns (RunRecord);
  rpc PutCode(PutCodeRequest) returns (PutCodeReply);
  // One ordered stream per client: submissions, watches, releases and
  // cancellations go up; acks, outcomes and actor changes come down.
  rpc Session(stream ClientMsg) returns (stream SessionEvent);
  rpc GetTask(TaskKey) returns (TaskRecord);
  rpc GetActor(ActorQuery) returns (ActorRecord);
  rpc Explain(ExplainRequest) returns (ExplainReply);
  // Page through a run's tasks and outcomes (reattach, inspection).
  rpc ListTasks(ListTasksRequest) returns (ListTasksReply);
  // Every run the cluster holds, newest first (`chimaera runs`).
  rpc ListRuns(ListRunsRequest) returns (ListRunsReply);
  // The cluster's live named actors (`ch.runs.actors()`, `chimaera actors`).
  rpc ListActors(ListActorsRequest) returns (ListActorsReply);
  rpc Status(StatusRequest) returns (StatusReply);
  rpc Shutdown(ShutdownRequest) returns (ShutdownReply);
  // Bring an object produced on another peer into this peer's store.
  rpc Localize(LocalizeRequest) returns (LocalizeReply);
  // Copy objects this peer stores to other peers, other failure domains
  // first, and answer once the copies are made (a retained ch.put).
  rpc Retain(RetainRequest) returns (RetainReply);
  // Hold (or release) stored files of another run for this session: they
  // outlive that run's end until released (a ch.put handle unpickled here).
  rpc Borrow(BorrowRequest) returns (BorrowReply);
  // Hold resources on a peer's ledger for a gang generation or a
  // reservation, all of them or none (forwarded to that peer).
  rpc Hold(HoldRequest) returns (HoldReply);
  // Large values from clients that do not share the peer's filesystem: which
  // of these blobs the run lacks, upload one (checked against its digest),
  // and read an object back (by range).
  rpc HasBlobs(HasBlobsRequest) returns (HasBlobsReply);
  rpc PutBlob(stream PutBlobChunk) returns (PutBlobReply);
  // A value under the id it already has (a ch.put value from another cell):
  // checked against its checksum instead of its id.
  rpc PutObject(stream PutObjectChunk) returns (PutObjectReply);
  rpc GetObject(GetObjectRequest) returns (stream GetObjectChunk);
  rpc Store(StoreRequest) returns (StoreReply);
  // Events this peer saw (member changes, actor transitions, final task
  // failures, controller decisions, drains), as a long poll. Best effort,
  // bounded and per peer: the durable record is the shard's.
  rpc Events(EventsRequest) returns (EventsReply);
  // A run's output from the calls this peer ran, from a byte offset; waits
  // up to wait_ms for more when there is none yet (`chimaera logs`).
  rpc Logs(LogsRequest) returns (LogsReply);
}

message ClusterEvent {
  uint64 seq = 1;          // per peer, from 1; restarts with the peer
  uint64 at_unix_ms = 2;
  string kind = 3;         // member | actor | task_failed | decision | drain
  bytes node = 4;          // the peer the event is about (member, drain)
  bytes run = 5;
  TaskKey task = 6;
  bytes actor = 7;
  string message = 8;
  string detail_json = 9;
}

message EventsRequest {
  repeated string kinds = 1;   // empty: all kinds
  uint64 since = 2;            // events with seq >= since
  uint32 wait_ms = 3;          // wait this long for one if there is none yet
}

message LogsRequest {
  bytes run = 1;
  uint64 offset = 2;
  uint32 wait_ms = 3;          // at most 30 000
}

message LogsReply {
  bytes text = 1;              // whole lines when they fit
  uint64 next = 2;             // pass as `offset` next time
  uint64 size = 3;             // the run's output on this peer so far
}

message EventsReply {
  repeated ClusterEvent events = 1;
  uint64 next = 2;             // pass as `since` next time
  bytes peer = 3;              // the answering peer
  uint64 incarnation = 4;      // a new incarnation means seq restarted
}

message HasBlobsRequest {
  bytes run = 1;
  repeated bytes blob_ids = 2;
}

message HasBlobsReply {
  repeated bytes missing = 1;
}

// The first chunk names the blob; every chunk carries at most 1 MiB of data.
message PutBlobChunk {
  bytes run = 1;
  bytes blob_id = 2;   // blake3 of the whole blob, first 16 bytes
  uint64 size = 3;
  bytes data = 4;
  // On the first chunk: the peer makes no background copy of it (a ch.put
  // whose durability is not the default).
  bool keep_local = 5;
}

message PutBlobReply {}

message PutObjectChunk {
  bytes run = 1;        // the first chunk names the run, the 16-byte id, size and checksum
  bytes object_id = 2;
  uint64 size = 3;
  bytes checksum = 4;   // blake3 of the whole value, first 16 bytes
  bytes data = 5;
}

message PutObjectReply {}

message GetObjectRequest {
  bytes run = 1;
  bytes object_id = 2;
  uint64 offset = 3;
  uint64 len = 4;      // 0 = to the end
}

message GetObjectChunk {
  bytes data = 1;
  uint64 total = 2;    // set on the first chunk: bytes in the requested range
  bytes checksum = 3;  // blake3 of `data`, first 16 bytes
}

message ClientHello {
  uint32 wire_version = 1;
  string client = 2;       // "python-3.14.7 chimaera-0.1.0"
  string token = 3;        // cluster mode; local sockets are authenticated by file mode and peer credentials
  string tenant = 4;
}

message PeerInfo {
  uint32 wire_version = 1;
  bytes peer = 2;
  uint64 incarnation = 3;
  string object_dir = 4;   // local mode: clients read and write objects here directly
  string code_dir = 5;
  uint64 inline_limit = 6;
  double usable_cores = 7;
  uint64 memory_bytes = 8;
  string version = 9;
  repeated string gpus = 10;
  // Records actor calls a driver ran directly (TaskSpec.ran, .direct): a
  // driver sends calls straight to actors here only when this is set.
  bool direct_actor_calls = 11;
  // Copies this peer makes of each new object in the background (0: none).
  // A writer that wants none of an object leaves a marker for it first.
  uint32 replicas = 12;
  // ch.auto(initial=...) on cpus or memory is learnable here (Policy.cpus_initial);
  // an older peer treats an initial value as the caller's.
  bool learns_initial = 13;
}

message CreateRunRequest {
  string tenant = 1;
  string submission_key = 2;   // idempotency key; a retry returns the same run
  bool detached = 3;
  uint64 client_grace_ms = 4;
  string description = 5;
  bytes code_digest = 6;
  bytes env_digest = 7;
  // How executors for this run start (local mode runs the client's own
  // interpreter, working directory and import path).
  string python = 8;
  string cwd = 9;
  repeated string sys_path = 10;
  map<string, string> env = 11;
}

message PutCodeRequest {
  bytes digest = 1;
  bytes code = 2;
}

message PutCodeReply {
  bool stored = 1;
}

message ActorCreateMsg {
  ActorSpec spec = 1;
  TaskSpec ctor = 2;
}

message WatchMsg {
  repeated TaskKey tasks = 1;
}

message CancelMsg {
  TaskKey task = 1;
  bool force = 2;
  ErrorRecord.Kind reason = 3;
}

message ClientMsg {
  uint64 seq = 1;   // echoed on the matching ack
  oneof msg {
    SubmitTasks submit = 2;      // grant_to is ignored; the peer places work
    WatchMsg watch = 3;
    Release release = 4;
    CancelMsg cancel = 5;
    ActorCreateMsg actor_create = 6;
    bytes attach_run = 7;        // adopt an existing run (reattach)
    bool heartbeat = 8;
    // The driver is exiting normally: finish the run and cancel what remains
    // unless it was created detached.
    bool finish_run = 9;
    // Close an actor: pending calls fail, its process ends, it is not restarted.
    bytes close_actor = 10;
    // A stream consumer has taken items below `up_to`.
    StreamCredit stream_credit = 11;
    EndRun end_run = 12;         // finish or cancel a run by id (Run.finish / Run.cancel)
    ReleaseObjects release_objects = 13;
    // Forget these dead letters (Run.retry_failed resubmitted them, or Run.discard_failed).
    Release discard_failed = 14;
    // Events received up to and including this SessionEvent.cursor. The first
    // one (0 will do) asks the peer to keep what a resume needs.
    uint64 ack_cursor = 15;
    // Sent first on a new stream: continue a session whose stream broke.
    ResumeSession resume = 16;
  }
}

message ResumeSession {
  uint64 session = 1;   // SessionEvent.opened of the broken stream
  uint64 cursor = 2;    // the last SessionEvent.cursor received on it
}

// ch.put values nothing refers to any more and whose readers have finished:
// their copies go from every peer.
message ReleaseObjects {
  bytes run = 1;
  repeated bytes object_ids = 2;
}

message EndRun {
  bytes run = 1;
  bool cancel = 2;   // true: cancel its unfinished calls; false: finish it (leftovers are cancelled too)
}

message StreamCredit {
  TaskKey task = 1;
  uint64 up_to = 2;
}

message StreamItem {
  TaskKey task = 1;
  uint32 attempt = 2;
  uint64 index = 3;
  Outcome value = 4;
}

message OutcomeEvent {
  TaskKey task = 1;
  Outcome outcome = 2;
}

message LogEvent {
  TaskKey task = 1;
  string stream = 2;
  string text = 3;
  uint32 pid = 4;
}

message SessionEvent {
  uint64 seq = 1;   // ack of ClientMsg.seq; 0 for unsolicited events
  oneof event {
    TaskAcks acks = 2;
    OutcomeEvent outcome = 3;
    ActorAck actor = 4;
    string error = 5;
    LogEvent log = 6;
    StreamItem stream_item = 7;
    // The session's id, first on every stream (ResumeSession names it).
    uint64 opened = 9;
    // Answers a ResumeSession once this peer has taken the old session over:
    // the seq of the last ClientMsg it handled. The client sends again what
    // it sent after that, and nothing else before this arrives.
    uint64 resumed = 10;
  }
  // Outcomes, generator items and replies count up from 1, once the session
  // has sent an ack_cursor; 0 on other events.
  uint64 cursor = 8;
  // Once the session has sent an ack_cursor: the seq of the last ClientMsg
  // this peer has handled. The client keeps what it sent after it, for a resume.
  uint64 taken = 11;
}

message ActorQuery {
  bytes actor = 1;
}

message ExplainRequest {
  bytes run = 1;
  TaskKey task = 2;          // one task; empty = run summary
  bool decisions = 3;
  bool pending = 4;
}

// One attempt as measured by its peer. Every measurement carries how and over
// what scope it was taken; a missing value is absent, never zero.
message Measure {
  double value = 1;
  string scope = 2;      // attempt | process | process_lifetime | sampled | pool
  string method = 3;     // cgroup | rusage | proc | sampled
  double coverage = 4;   // fraction of the attempt the measurement covers
}

message AttemptRecord {
  TaskKey task = 1;
  uint32 attempt = 2;
  PeerInc peer = 3;
  uint32 executor = 4;
  string fn_name = 5;
  uint64 submitted_unix_ns = 6;
  uint64 ready_unix_ns = 7;
  uint64 dispatched_unix_ns = 8;
  uint64 py_entry_unix_ns = 9;
  uint64 py_exit_unix_ns = 10;
  uint64 published_unix_ns = 11;
  Policy granted = 12;
  map<string, Measure> measures = 13;   // cpu_seconds, mean_cores, rss_peak_bytes, ...
  string end_reason = 14;               // ok | user_error | oom | killed | cancelled | peer_lost | ...
  string detail = 15;
  string placement_reason = 16;
  // CPU and memory this attempt reserved, and where each came from.
  string reservation = 17;
  // Its inputs were all on the peer and it joined the run queue. Between
  // ready and this it fetched inputs; between this and dispatched it waited
  // in the peer's queue (admission, an executor); between dispatched and
  // py_entry it waited in the executor behind calls batched ahead of it.
  uint64 queued_unix_ns = 19;
  // The same, setting by setting (settings.rs): cpus, memory and batch.
  repeated Setting settings = 18;
}

// One setting an attempt ran with. `value` was granted; `requested` is what
// its source chose before a bound or limit applied (they differ only when
// `source` is "clamped", and `reason` says why).
message Setting {
  string name = 1;         // cpus | memory (bytes) | batch (calls per executor round trip)
  double value = 2;
  double requested = 3;
  double min = 4;          // ch.auto bounds; 0 = none
  double max = 5;
  string source = 6;       // user | initial | default | learned | trial | observed | raised | clamped
  string reason = 7;
}

message Decision {
  uint64 at_unix_ns = 1;
  string controller = 2;
  string knob = 3;
  string scope = 4;
  string old_value = 5;
  string new_value = 6;
  string outcome = 7;     // adopted | reverted | clamped | observed | pending
  string evidence = 8;
  string reason = 9;
}

message ExplainReply {
  RunRecord run = 1;
  TaskRecord task = 2;
  repeated AttemptRecord attempts = 3;
  repeated Decision decisions = 4;
  string pending_reason = 5;
  map<string, uint64> counts = 6;    // run summary: tasks by state
}

message StatusRequest {
  // Also gather what every live peer's object store holds (StatusReply.objects).
  bool objects = 1;
  // With `objects`: how many of each store's largest objects to list
  // (0: ten; at most 10,000).
  uint32 largest = 5;
  // Federation: only StatusReply.fleet, with this cell's own capacity first.
  // The reply's size is bounded whatever the cell's size.
  bool fleet = 2;
}

message StatusReply {
  PeerInfo peer = 1;
  repeated RunRecord runs = 2;
  uint32 executors = 3;
  uint32 busy_executors = 4;
  uint64 queued = 5;
  uint64 running = 6;
  double cpu_in_use = 7;
  uint64 object_bytes = 8;
  repeated string pending_reasons = 9;
  uint32 sessions = 10;
  // Grant-to-handoff latency of the last attempts dispatched (warm path):
  // from a granted attempt reaching the core to its Execute being sent.
  double dispatch_p50_us = 11;
  double dispatch_p99_us = 12;
  uint64 dispatch_samples = 13;
  // Shard commands this peer proposed that have not been answered yet.
  uint64 proposals_in_flight = 14;
  // Memory pool: executor charges plus objects in tmpfs, in bytes.
  uint64 memory_pool = 15;
  uint64 memory_used = 16;
  uint64 memory_available = 17;
  // Settings the peer chose for itself, each with how it was derived.
  repeated string automatic = 18;
  // Learned transfer rates to other peers ("node: MB/s, rtt ms").
  repeated string links = 19;
  // Every peer this one knows (only itself when it runs alone): ch.cluster().
  repeated ClusterNode nodes = 20;
  // With StatusRequest.objects: each live peer's object store, as JSON
  // (chimaera-peer objplane::inventory plus its "addr").
  repeated string objects = 21;
  // The groups this peer holds a replica of, as this replica sees them.
  repeated GroupStatus groups = 22;
  // How many data groups the cluster has (0 on a local peer).
  uint32 data_groups = 23;
  // What an acknowledged commit survives ("process", "reboot", "machine"):
  // asked for by this peer's CHIMAERA_RAFT_SYNC, and given by the weakest of
  // the cluster's groups as their voters' syncing and machines allow.
  string durability_requested = 24;
  string durability_effective = 25;
  // Why service is below what was asked: groups whose voters give less, a slow disk.
  repeated string durability_degraded = 26;
  // Events waiting in sessions' mailboxes for their readers, in bytes, and
  // what waits beyond them for a slow reader to catch up (outcomes as their
  // task keys, generator items).
  uint64 session_bytes = 27;
  uint64 session_backlog = 28;
  // What this peer sent other peers in bulk, by traffic class, and the rate
  // it paces them at (CHIMAERA_MESH_RATE, bytes per second; 0: unpaced).
  repeated TrafficStatus traffic = 29;
  uint64 mesh_rate = 30;
  // Round trips of the Raft heartbeats (appends with no entries) this peer
  // sent lately, which pacing keeps short.
  double heartbeat_p50_us = 31;
  double heartbeat_p99_us = 32;
  // Federation (docs/federation.md): what this peer last read of its cell's
  // view of the other cells; empty without a fleet.
  FleetView fleet = 33;
  // Calls on this peer, and the actors it hosts, by state. Each has a fixed
  // set of states, every one present (zero included): Prometheus labels.
  map<string, uint64> tasks_by_state = 34;
  map<string, uint32> actors_by_state = 35;
  // How long the longest-waiting call queued here has waited for a slot, in
  // seconds (0 when none waits): the backlog's age, a scaling signal.
  double queue_oldest_seconds = 36;
}

// One cell's free capacity of one resource class, as the fleet hears of it.
message CellCapacity {
  reserved 2;
  string cell = 1;
  string region = 3;    // its peers' `region` label
  string resource = 4;  // the resource class: "cpu"
  double free = 5;      // free, less what waits in its queues
  double total = 6;
  uint64 number = 7;    // when the cell made the report (unix ms, its clock): a newer one is larger
  uint32 age = 8;       // rounds since, as the cells that passed it on counted: 0 is the cell's own, just made
  // The reporting cell's FleetView.cell (0: a cell outside any fleet): a
  // cell drops its own reports, which come back under other cells' names for it.
  uint64 origin = 9;
}

message FleetCell {
  string name = 1;
  string endpoint = 2;
}

// What a cell's summary publisher learned, in the cell's own store for its
// peers to read: reports of other cells (a bounded digest) and the cells it
// may ask, from configuration and the directory.
message FleetView {
  repeated CellCapacity capacity = 1;
  repeated FleetCell cells = 2;
  uint64 directory_revision = 3;  // the directory's revision `cells` has caught up to (0: none read)
  uint64 epoch = 4;               // the publisher's fencing token
  bool publishing = 5;            // in a Status reply: the answering peer is its cell's publisher
  uint64 cell = 6;                // this cell's id: the node id of its first publisher
}

message TrafficStatus {
  string name = 1;      // foreground, shuffle, recovery, checkpoint
  uint32 weight = 2;    // its share of the rate while other classes want it
  uint64 bytes = 3;     // sent since the peer started
  double waited_s = 4;  // time its sends waited for their turn
}

message GroupStatus {
  uint32 group = 1;
  string leader = 2;      // the leader's address; empty: none known
  uint32 voters = 3;
  uint64 last_log = 4;
  uint64 applied = 5;
  bool leading = 6;       // this peer leads it
  uint64 max_lag = 7;     // when leading: entries the furthest-behind voter lacks
  string durability = 8;  // what its acknowledged commits survive (see StatusReply.durability_effective)
}

message ClusterNode {
  bytes peer = 1;
  string addr = 2;
  double cpus = 3;
  uint64 memory_bytes = 4;
  repeated string gpus = 5;
  bool alive = 6;
  double cpu_used = 7;     // from its last load report
  uint64 queued = 8;
  bool this_peer = 9;      // the peer that answered
  map<string, string> labels = 10;
  repeated uint32 leading = 11;  // raft groups it leads (others: from their last load report)
  uint32 actors = 12;            // actor instances it hosts
  uint64 object_bytes = 13;      // bytes of values it stores
  bool draining = 14;            // stopping: it takes no new work
  uint32 object_layout = 15;     // the newest layout of stored results it reads (Member.object_layout)
  Demand demand = 16;            // from its last load report; unset from a peer too old to send one
  uint64 load_age_ms = 17;       // how old its load report is (0 for the answering peer)
  bool starting = 18;            // no load report yet: its core has not answered, or it was not probed yet
  uint64 incarnation = 19;       // its incarnation: a restarted peer's counters start again
}

message ShutdownRequest {}
message ShutdownReply {}

message LocalizeRequest {
  bytes run = 1;
  bytes object_id = 2;
  // The call whose result this is: when every copy is lost, the peer runs it
  // again (lineage) if it can be, else the reply says why not.
  TaskKey task = 3;
  TrafficClass traffic = 4;  // why it is read: a shuffle's gather, or a call (the default)
}

message LocalizeReply {}

message RetainRequest {
  bytes run = 1;
  repeated bytes object_ids = 2;
}

message RetainReply {}

message BorrowRequest {
  uint64 session = 1;              // the caller's session (SessionEvent.opened)
  bytes run = 2;
  repeated bytes object_ids = 3;   // a value's file and the files it links
  bool release = 4;
}

message BorrowReply {}

// Hold slots of resources on one peer for `owner` (a gang or a reservation),
// every slot or none. A hold lasts until the owner releases it or lets
// `ttl_ms` pass without renewing it; a call or actor carrying a slot's
// LaunchToken takes that slot's resources as its own. A newer generation of
// the owner ends an older one's hold on that peer.
message HoldRequest {
  string cluster = 1;              // set between peers
  bytes peer = 2;                  // the peer to hold on; empty: the one asked
  string owner = 3;                // empty: change nothing, only list the holds
  uint64 generation = 4;
  repeated HoldShape slots = 5;    // empty: release the owner's hold (this generation or older)
  uint64 ttl_ms = 6;
  bool renew = 7;                  // only extend a hold this generation already has
}

message HoldShape {
  double cpus = 1;
  double gpus = 2;
  string device = 3;
}

message HoldReply {
  bool held = 1;
  string reason = 2;               // why not
  repeated string holds = 3;       // what the peer holds now, one line per owner
  bool never = 4;                  // not even with nothing else running there (too large, or no such device)
}

message ListActorsRequest {
  string prefix = 1;               // names starting with this; empty = all
}

message ListActorsReply {
  repeated ActorRecord actors = 1; // named and not dead, by tenant then name
  repeated uint32 unavailable = 2; // groups no replica answered for
}

message ListRunsRequest {
  uint32 limit = 1;   // 0 = all
}

message ListRunsReply {
  repeated RunRecord runs = 1;     // newest first, without exec_env
  repeated uint32 unavailable = 2; // groups no replica answered for: the list misses their runs
}

message ListTasksRequest {
  bytes run = 1;
  bytes after_task = 2;   // exclusive cursor; empty = from the start
  uint32 limit = 3;
  bool failed = 4;        // the run's dead letters instead (all of them, oldest first per vshard)
}

message ListTasksReply {
  repeated OutcomeEvent tasks = 1;   // outcome unset while the task is not done
  repeated TaskRecord.State states = 2;
  bytes next_after = 3;              // empty when there are no more
  repeated DeadLetter failed = 4;    // with `failed`: the dead letters
  repeated TaskKey failed_keys = 5;  // and their tasks, in the same order
}

// ch.Store: one write, one transaction, or one read. A CHANGES read with
// wait_ms waits up to that long for a change after after_revision (a watch's
// long poll).
message StoreRequest {
  StoreWrite write = 1;
  StoreRead read = 2;
  uint32 wait_ms = 3;
  StoreTxn txn = 4;
  StoreClaim claim = 5;
}
