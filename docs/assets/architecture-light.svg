<text x="650" y="88" font-size="13" font-weight="600" fill="#1f2328">No head node.</text>
<text x="650" y="106" font-size="12.5" fill="#59636e">Every machine runs the same peer.</text>
<text x="650" y="136" font-size="13" font-weight="600" fill="#1f2328">Raft groups (g1, g2, g3)</text>
<text x="650" y="154" font-size="12.5" fill="#59636e">replicate the record of every call</text>
<text x="650" y="172" font-size="12.5" fill="#59636e">on three peers each.</text>
<text x="650" y="202" font-size="13" font-weight="600" fill="#1f2328">Peers talk directly</text>
<text x="650" y="220" font-size="12.5" fill="#59636e">and fetch values from each other.</text>
<text x="24" y="316" font-size="11.5" fill="#59636e">Any peer can serve your script, run calls and lead groups. Lose a machine and its calls run elsewhere.</text>
