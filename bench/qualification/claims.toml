# Every claim of speed, scale and fault tolerance the README makes, every
# claim of its status table, and every measured section of
# docs/qualification.md, with what backs it. build_manifest.py turns this into
# a release's signed qualification manifest and refuses to while a claim is
# not listed here, a quote or section is gone, or an artifact changed.
#
# kind: speed, scale, fault or function. tier: local, linux, launchers,
# cluster, gpu or emulation (docs/qualification.md's labels).
# quotes: README claims, exactly as build_manifest.readme_claims reads them.
# sections: headings of docs/qualification.md the entry covers.
# artifacts: raw results kept in the repository, with their sha256.
# lanes: lanes (build_manifest.py lane NAME) whose passing record on the
#   release's source backs the claim; its log is the artifact.
# replay: the command that measures it again.
# pending: why the claim is not traced to raw artifacts yet.
# limit: the tested limit it sets.

[[claim]]
id = "ray-64-nodes"
kind = "speed"
tier = "cluster"
quotes = []  # the README now quotes the 2026-11-24 round (ray-cluster-2026-11-24)
sections = ["Ray comparison (cluster, 1, 4, 16 and 64 nodes, 2026-11-22)"]
replay = "anyscale job submit -f deploy/anyscale/eval-64node.job.yaml --wait (eval-1node, eval-4node and eval-16node for the other sizes)"
pending = "the round's raw results (multi_results.json) stayed in the cloud jobs' storage and were not kept"
limit = { what = "machines in one cluster (c7i.4xlarge, 1,024 vCPU)", value = 64 }

[[claim]]
id = "ray-cluster-2026-11-24"
kind = "speed"
tier = "cluster"
quotes = [
  "Chimaera against Ray on 1, 4, 16 and 64 machines: faster at every size on a map over tiny items (96x to 228x), a 32 MiB array passed to every call (3.9x to 5.2x), independent tasks (1.8x to 2.5x), recovery from a machine killed mid-run (1.9x to 2.1x) and calls on a value just made (1.1x to 1.6x).",
  "On 64 machines, Chimaera finishes 2.5x as many tasks a second as Ray: 11,235 against 4,502.",
  "Kill one of those machines two seconds into 4,096 one-second calls, and all of them are done in 9.6 s.",
  "Ray needs 18.5 s.",
  "Pass the same 32 MiB array to each call and Chimaera is 4.7x faster, because it stores the array once.",
  "Map a function over tiny items and it gets through them 180x faster, with no batching by hand on either side: it sizes the batches itself.",
  "The chart's five workloads lead at every size we measured, from 1 machine to 64.",
  "The numbers behind the chart, on 64 machines",
  "64 × c7i.4xlarge machines (1,024 vCPU), commit 933f9a2, Ray 2.59.0, on 2026-11-24.",
  "Each cell is the median of at least 35 s of repetitions (the machine-loss row is a single run).",
  "| Independent no-op tasks | 4,502/s | 11,235/s |",
  "| Map over tiny items, no hand batching | 4,394/s | 789,192/s |",
  "| 32 MiB array passed straight to 2,048 calls | 4.26 s | 0.91 s |",
  "| 10 calls on a 256 MiB value just made | 0.257 s | 0.228 s |",
  "| Ray's task throughput | Ray's speed mapping over tiny items | Ray's speed passing one 32 MiB array to every call | Ray's speed recovering from a machine killed mid-run |",
  "On 64 machines against Ray 2.59.",
]
