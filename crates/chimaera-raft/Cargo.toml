[package]
name = "chimaera-raft"
description = "Multi-raft host for Chimaera shard groups (openraft + redb)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chimaera-core.workspace = true
chimaera-proto.workspace = true
blake3.workspace = true
openraft = { version = "=0.10.1", features = ["serde"] }
redb = "5.0"
tokio.workspace = true
libc.workspace = true
tracing.workspace = true
thiserror.workspace = true
prost.workspace = true
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
# network.rs tests run on tokio's paused clock.
tokio = { workspace = true, features = ["test-util"] }
openraft = { version = "=0.10.1", features = ["serde"] }
