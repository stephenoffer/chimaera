[package]
name = "chimaera-peer"
description = "The Chimaera peer agent: scheduling, execution, objects, accounting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "chimaera"
path = "src/main.rs"

[dependencies]
chimaera-core.workspace = true
chimaera-proto = { workspace = true, features = ["grpc"] }
chimaera-raft.workspace = true
prost.workspace = true
tonic = { workspace = true, features = ["codegen", "transport", "server", "router"] }
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.5"
futures-util = "0.3"
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
blake3.workspace = true
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
