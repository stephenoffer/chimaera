[package]
name = "chimaera-peer"
description = "The Chimaera peer agent: scheduling, execution, objects, accounting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "chimaera"
path = "src/main.rs"

[dependencies]
chimaera-core.workspace = true
chimaera-proto = { workspace = true, features = ["grpc"] }
chimaera-raft.workspace = true
prost.workspace = true
tonic = { workspace = true, features = ["codegen", "transport", "server", "router", "tls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.5"
futures-util = "0.3"
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
blake3.workspace = true
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
object_store = { version = "0.12", optional = true, features = ["aws", "gcp", "azure"] }
url = { version = "2", optional = true }

[features]
# Spilling to S3, GCS or Azure Blob (CHIMAERA_SPILL_URL). Off by default: it
# brings in an HTTP and cloud-auth stack that local builds do not need.
object-store-spill = ["dep:object_store", "dep:url"]

[dev-dependencies]
tempfile = "3"
